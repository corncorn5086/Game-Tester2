appId: dev.ember.desktop
productName: Ember
copyright: Copyright © 2026 Ember
# Pinned so packaging works in hoisted npm-workspace layouts without relying on
# electron-version auto-detection. Keep in sync with the electron devDependency.
electronVersion: 33.4.11

# The renderer is built by `vite build` (npm run build) into dist/ before packaging.
directories:
  output: release
  buildResources: build-resources

# What ships inside the app. Workspace deps (@ember/agent, @ember/shared) are
# symlinked by npm workspaces; electron-builder dereferences and bundles them.
files:
  - electron/**/*
  - dist/**/*
  - standalone/**/*
  - package.json
  - "!**/*.map"

asar: true

# The agent core runs inside the main process; nothing needs to stay unpacked
# unless you later add native modules (node:sqlite is built into Node/Electron).

win:
  target:
    - nsis
    - portable
  icon: build-resources/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ember

mac:
  target:
    - dmg
  icon: build-resources/icon.png
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  icon: build-resources/icon.png
  category: Development
