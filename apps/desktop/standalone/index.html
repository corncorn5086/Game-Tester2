<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Desktop</title>
<link rel="icon" href="ember-logo.png">

<!-- Typography — the Ember identity mixes six voices:
     Syne (futurist display) · Shippori Mincho (Japanese mincho, large numerals & kanji)
     Instrument Serif (poetic italic accents) · Hanken Grotesk (interface)
     JetBrains Mono (technical) · Bricolage Grotesque (kept for the Welcome page)
     Self-hosted in fonts/ so the app stays fully offline. -->
<link rel="stylesheet" href="fonts.css">

<!-- Molten orb fallback frame (static PNG shown until WebGL takes over) -->
<link rel="stylesheet" href="orb-fallback.css">
<!-- Ember design system -->
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="root"></div>

<!-- Local vendor runtime (offline-first, no CDN) -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<!-- <molten-core> — WebGL fire orb custom element (preserved from v21) -->
<script src="molten-core.js"></script>
<script src="vendor/babel.min.js"></script>
<!-- The Ember Desktop application -->
<script type="text/babel" src="app.jsx" data-presets="react"></script>
</body>
</html>
